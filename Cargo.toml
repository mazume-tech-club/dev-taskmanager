[package]
name = "commitwatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
egui_plot = "0.38"
env_logger = "0.11.11"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_System_Performance", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Wdk_System_SystemInformation", "Wdk_Foundation", "Win32_System_WindowsProgramming", "Win32_System_Memory", "Win32_System_Power"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
